<app-header />
<app-navbar />

<main class="pagina">
  <h1>Clientes</h1>

  <app-filters
    [filters]="filtros()"
    (apply)="onAplicarFiltros($event)"
    (clear)="onLimpiarFiltros()"
  />

  @if (errorRango()) {
    <p class="clientes-error">{{ errorRango() }}</p>
  }

  <section class="clientes-contenido">
    <app-table
      title="Listado de clientes"
      [columns]="clientesColumns"
      [data]="clientesData()"
    />
  </section>
</main>
