<div class="inicio-container">
  <!-- Sección Izquierda -->
  <div class="columna-izquierda">
  
    <div class="inicio-container"> <!-- Sección Izquierda --> <div class="columna-izquierda"> 
      <img src="logo_lumen.jpeg" alt="Logo Lumen Legal" class="logo-principal"> </div> <!-- Sección Derecha -->



  </div>

  <!-- Sección Derecha -->
  <div class="columna-derecha">
    <!-- Contenido Superior -->
    <div class="contenido-superior">
      <h1 class="titulo-principal">Abogados especializados en propiedad intelectual.</h1>
    </div>

    <!-- Contenido Inferior - Formulario de Login -->
    <div class="contenido-inferior">
      <div class="login-container">
        <h2 class="titulo-login">Iniciar Sesión</h2>
        <p class="descripcion-login">Accede a tu cuenta de Lumen Legal</p>

        <form (ngSubmit)="login()" class="formulario-login">
          <!-- Campo Usuario -->
          <div class="grupo-formulario">
            <label for="usuario" class="etiqueta">Usuario</label>
            <input
              type="text"
              id="usuario"
              [(ngModel)]="usuario"
              name="usuario"
              class="input-campo"
              placeholder="Ingresa tu usuario"
              required>
          </div>

          <!-- Campo Contraseña -->
          <div class="grupo-formulario">
            <label for="password" class="etiqueta">Contraseña</label>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              class="input-campo"
              placeholder="Ingresa tu contraseña"
              required>
          </div>

          <!-- Mensaje de Error -->
          <div *ngIf="mostrarError" class="mensaje-error">
            {{ mensajeError }}
          </div>

          <!-- Botones -->
          <div class="grupo-botones">
            <button type="submit" class="boton-login">
              Iniciar Sesión
            </button>
            <button type="button" (click)="limpiarFormulario()" class="boton-limpiar">
              Limpiar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
