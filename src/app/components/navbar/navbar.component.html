<nav class="app-navbar">
  <ul class="app-navbar__list">
    @for (link of links; track link.path) {
      <li class="app-navbar__item">
        <a
          class="app-navbar__link"
          [routerLink]="link.path"
          routerLinkActive="app-navbar__link--active"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>

  <!-- Sección de Usuario y Logout -->
  <div class="app-navbar__user-section">
    @if (usuario) {
      <span class="app-navbar__usuario">{{ usuario }}</span>
    }
    <button class="app-navbar__logout" (click)="logout()">
      Cerrar Sesión
    </button>
  </div>
</nav>
