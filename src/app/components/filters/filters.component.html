<section class="app-filters">
  <div class="app-filters__controls">
    @for (filter of filters(); track filter.name) {
      <label class="app-filters__field">
        <span class="app-filters__label">{{ filter.label }}</span>
        @if (filter.type === 'text') {
          <input
            class="app-filters__select"
            type="text"
            [placeholder]="filter.placeholder ?? ''"
            [value]="values()[filter.name] ?? ''"
            (input)="onChange(filter.name, $any($event.target).value)"
          />
        } @else if (filter.searchable) {
          <div class="app-filters__combobox">
            <input
              class="app-filters__select"
              type="text"
              autocomplete="off"
              [placeholder]="filter.placeholder ?? 'Escribe para buscar...'"
              [value]="searchText()[filter.name] ?? ''"
              (input)="onSearchInput(filter.name, $any($event.target).value)"
              (focus)="onSearchFocus(filter.name)"
              (blur)="onSearchBlur()"
            />
            @if (openDropdown() === filter.name) {
              <ul class="app-filters__dropdown">
                @for (option of filteredOptions(filter); track option.value) {
                  <li
                    class="app-filters__dropdown-item"
                    (mousedown)="$event.preventDefault(); onSelectOption(filter.name, option)"
                  >
                    {{ option.label }}
                  </li>
                } @empty {
                  <li class="app-filters__dropdown-empty">Sin resultados</li>
                }
              </ul>
            }
          </div>
        } @else {
          <select
            class="app-filters__select"
            [value]="values()[filter.name] ?? ''"
            (change)="onChange(filter.name, $any($event.target).value)"
          >
            <option value="">Todos</option>
            @for (option of filter.options; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        }
      </label>
    }
  </div>

  <div class="app-filters__actions">
    <button type="button" class="app-filters__button app-filters__button--apply" (click)="onApply()">
      Aplicar filtros
    </button>
    <button type="button" class="app-filters__button app-filters__button--clear" (click)="onClear()">
      Limpiar
    </button>
  </div>
</section>
