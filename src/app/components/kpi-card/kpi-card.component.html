<article class="kpi-card">
  <p class="kpi-card__title">{{ displayTitle() }}</p>
  <div class="kpi-card__value-container">
    <p [class.kpi-card__value--positive]="shouldBeGreen()" [class.kpi-card__value--negative]="shouldBeRed()" class="kpi-card__value">{{ formattedValue() }}</p>
    
  </div>
</article>
